name: Web Engine
on:
  push:
    branches: [main, mimicry-browser-runtime]
  pull_request:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run typecheck --workspace @mimicry/expo-demo
      - run: npx tsc --project packages/runtime/tsconfig.json
      - run: npm run export:web --workspace @mimicry/expo-demo
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-preview-screenshot
          path: artifacts/mimicry-browser-smoke.png
          if-no-files-found: ignore
