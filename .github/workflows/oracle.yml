name: Oracle (simulators)
# Captures real-simulator/emulator references for example projects and diffs
# them against Mimicry's renders. Which projects run on which platform is set
# in scripts/oracle-targets.json. Each job pushes its captures and report to
# an `oracle-out/<platform>-<project>` branch.
on:
  workflow_dispatch:
  push:
    branches: [oracle-run]
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.p.outputs.ios }}
      android: ${{ steps.p.outputs.android }}
      motion: ${{ steps.p.outputs.motion }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          node -e '
            const t = require("./scripts/oracle-targets.json");
            const fs = require("fs");
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              `ios=${JSON.stringify(t.ios ?? [])}\nandroid=${JSON.stringify(t.android ?? [])}\nmotion=${t.motion ? 1 : 0}\n`);'

  ios:
    needs: plan
    if: needs.plan.outputs.ios != '[]'
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.ios) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build, capture and compare
        id: run
        continue-on-error: true
        env:
          PROJECT: ${{ matrix.project }}
          MOTION: ${{ needs.plan.outputs.motion }}
        run: |
          set -o pipefail
          bash scripts/oracle-ios.sh 2>&1 | tee "$RUNNER_TEMP/oracle-log.txt"
      - name: Publish results
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT: ${{ matrix.project }}
          OUTCOME: ${{ steps.run.outcome }}
        run: bash scripts/oracle-publish.sh ios
      # The capture step continues on error so its results still publish;
      # the job reports the failure here.
      - name: Fail if the capture failed
        if: steps.run.outcome != 'success'
        run: exit 1

  android:
    needs: plan
    if: needs.plan.outputs.android != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.android) }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build, boot emulator, capture and compare
        id: run
        continue-on-error: true
        env:
          PROJECT: ${{ matrix.project }}
          MOTION: ${{ needs.plan.outputs.motion }}
          EMULATOR_LOG: ${{ runner.temp }}/emulator.log
        run: |
          set -o pipefail
          bash scripts/oracle-android.sh 2>&1 | tee "$RUNNER_TEMP/oracle-log.txt"
      - name: Publish results
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT: ${{ matrix.project }}
          OUTCOME: ${{ steps.run.outcome }}
        run: bash scripts/oracle-publish.sh android
      # The capture step continues on error so its results still publish;
      # the job reports the failure here.
      - name: Fail if the capture failed
        if: steps.run.outcome != 'success'
        run: exit 1
